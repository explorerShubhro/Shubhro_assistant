<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111a23">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pocket Assistant</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111a23;--mut:#62707d;--line:#d5dbe1;--dev:#0b7a5f;--net:#3a4bd1;--me:#111a23;--meink:#f4f6f8;--err:#b3321f}
@media(prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#18212a;--ink:#e6ecf1;--mut:#8b9aa7;--line:#28343f;--dev:#3ecf9f;--net:#8c9bff;--me:#2c4a63;--err:#ff8b73}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--net);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0}
h2{font-size:15px;margin:20px 0 8px}
#st{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
#st:before,.s:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
#st.net{color:var(--net)}#st.dev{color:var(--dev)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
section{flex:1;min-height:0;display:flex;flex-direction:column}
section[hidden]{display:none}
.pad{padding:4px 16px 16px;overflow:auto;display:block}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.m{overflow-wrap:anywhere;white-space:pre-wrap;max-width:90%}
.u{align-self:flex-end;background:var(--me);color:var(--meink);padding:9px 13px;border-radius:16px 16px 4px 16px}
.a{align-self:flex-start;max-width:100%}
.s{font-size:12px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px}
.s.dev:before{background:var(--dev)}.s.net:before{background:var(--net)}
.a pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.a code{font:.88em ui-monospace,Menlo,Consolas,monospace}
.err{color:var(--err);font-size:14px}
.empty{margin:auto;text-align:center;color:var(--mut);max-width:280px}
.bar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:flex-end}
#in{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;max-height:140px}
.go,.ic{min-height:44px;border-radius:12px;padding:0 16px;border:1px solid var(--line);background:var(--card)}
.go{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
form{display:flex;gap:8px}
form input,label input,label select{flex:1;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
label{display:block;margin:12px 0;font-size:14px;color:var(--mut)}
label input,label select{margin-top:4px;color:var(--ink)}
label.chk{display:flex;align-items:center;gap:10px;color:var(--ink)}
label.chk input{width:22px;height:22px;min-height:0;margin:0;flex:none}
ul{list-style:none;padding:0;margin:0}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
li span{flex:1;overflow-wrap:anywhere}
li button{min-width:36px;min-height:36px;background:none;border:1px solid var(--line);border-radius:8px}
li.done span{text-decoration:line-through;color:var(--mut)}
li.none{color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:13px 0;background:none;border:0;border-top:3px solid transparent;color:var(--mut);font-weight:600}
nav button.on{color:var(--ink);border-top-color:var(--net)}
</style>
</head>
<body>
<header><h1>Pocket Assistant</h1><span id="st" class="net">Online</span></header>
<main>
  <section id="v-chat">
    <div id="log"></div>
    <div class="bar">
      <button class="ic" id="mic" aria-label="Speak">Mic</button>
      <textarea id="in" rows="1" placeholder="Ask, or try: timer 5 min" aria-label="Message"></textarea>
      <button class="go" id="send">Send</button>
    </div>
  </section>
  <section id="v-tasks" class="pad" hidden>
    <h2>Tasks</h2>
    <form id="tf"><input id="ti" placeholder="Add a task" aria-label="New task"><button class="go">Add</button></form>
    <ul id="tl"></ul>
    <h2>Notes</h2>
    <form id="nf"><input id="ni" placeholder="Add a note" aria-label="New note"><button class="go">Add</button></form>
    <ul id="nl"></ul>
  </section>
  <section id="v-set" class="pad" hidden>
    <label>Provider<select id="prov"></select></label>
    <label id="rb">Base URL<input id="base" inputmode="url" autocomplete="off"></label>
    <label>Model<input id="model" autocomplete="off" placeholder="Model name from your provider's docs"></label>
    <label>API key<input id="key" type="password" autocomplete="off"></label>
    <label class="chk" id="rw"><input id="web" type="checkbox">Let Claude search the web</label>
    <label>Voice language<select id="lang"><option value="en-IN">English (India)</option><option value="bn-IN">Bengali</option><option value="hi-IN">Hindi</option></select></label>
    <p class="hint">Your key is saved only in this browser. Use a key with a low spend limit, and never put it in the code.</p>
    <button class="go" id="clr">Clear chat history</button>
  </section>
</main>
<nav>
  <button class="on" data-v="chat">Chat</button>
  <button data-v="tasks">Tasks</button>
  <button data-v="set">Setup</button>
</nav>
<script src="tools.js"></script>
<script src="app.js"></script>
</body>
</html>
